[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-streaming-bidirectional-gateway"
version = "0.1.0"
description = "High-throughput multiplexed frame gateway for streaming tool invocation outputs, partial progress chunks, and human interrupts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-streaming-bidirectional-gateway = "mcp_streaming_bidirectional_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_streaming_bidirectional_gateway*"]
